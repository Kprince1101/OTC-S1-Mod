name: Inject Jira Context for CodeRabbit

# Parses an OM-XX ticket key from the PR title, pulls the ticket's summary and
# rendered description from Jira, and injects them into the PR body inside a
# collapsible block delimited by <!-- jira-injected --> / <!-- /jira-injected -->
# sentinels. On subsequent edits the existing block is stripped and replaced
# with fresh Jira data so ticket updates flow through to the PR body.
#
# CodeRabbit's github-checks integration waits on this workflow before running
# auto-review, so the Jira block is present in the PR body by the time the
# review starts.

on:
  pull_request:
    # opened       — first PR creation
    # edited       — title/body edits (so Jira key changes in the title get picked up)
    # synchronize  — new commits pushed to the PR branch (re-pull Jira data to catch
    #                ticket updates that happened since the PR was opened)
    # reopened     — closed PRs being reopened
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  rebuild-pr-body:
    runs-on: ubuntu-latest
    steps:
      # gh CLI shells out to git for some startup probes even when --repo is
      # provided, so we need a real git context on the runner. A shallow
      # checkout is enough — we never read the source, just need .git to exist.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract Jira key from PR title
        id: parse
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Match the first OM-<digits> token in the title (case-sensitive).
          JIRA_KEY=$(echo "$PR_TITLE" | grep -oP 'OM-\d+' | head -n1 || true)
          echo "JIRA_KEY=$JIRA_KEY" >> "$GITHUB_ENV"
          if [ -z "$JIRA_KEY" ]; then
            echo "No Jira key found in title; skipping injection."
          else
            echo "Found Jira key: $JIRA_KEY"
          fi

      - name: Rebuild PR body with Jira context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: |
          set -euo pipefail

          # Fetch Jira data when a key is present. HAVE_JIRA gates the block
          # emission so PRs without an OM-XX key still pass through unchanged.
          HAVE_JIRA=0
          if [ -n "${JIRA_KEY:-}" ]; then
            # v3 + expand=renderedFields returns description as HTML instead of
            # Jira wiki markup, so GitHub renders headings/bold/code correctly.
            HTTP_CODE=$(curl -sS -o jira.json -w "%{http_code}" \
              -u "$JIRA_EMAIL:$JIRA_TOKEN" \
              -H "Accept: application/json" \
              "https://$JIRA_DOMAIN/rest/api/3/issue/$JIRA_KEY?expand=renderedFields")

            if [ "$HTTP_CODE" != "200" ]; then
              echo "::warning::Jira API returned HTTP $HTTP_CODE for $JIRA_KEY; skipping Jira injection."
              cat jira.json || true
            else
              HAVE_JIRA=1
              SUMMARY=$(jq -r '.fields.summary // "(no summary)"' jira.json)
              # Jira returns renderedFields.description as an empty string (not
              # null) when the ticket has no description, so the `//` fallback
              # alone isn't enough. Treat empty/whitespace-only as "no description".
              DESCRIPTION=$(jq -r '.renderedFields.description // ""' jira.json)
              if [ -z "$(echo "$DESCRIPTION" | tr -d '[:space:]')" ]; then
                DESCRIPTION="<em>No description provided.</em>"
              fi
              STATUS=$(jq -r '.fields.status.name // "Unknown"' jira.json)
              ISSUE_TYPE=$(jq -r '.fields.issuetype.name // "Issue"' jira.json)
              URL="https://$JIRA_DOMAIN/browse/$JIRA_KEY"
            fi
          fi

          # Snapshot the current PR body so we can diff the rebuild against it
          # and skip redundant edits (see the cmp guard near the bottom).
          # Explicit --repo avoids gh shelling out to git beyond what checkout
          # already provided. No "|| true": if gh fails, abort instead of
          # clobbering the PR body (set -euo pipefail will surface the failure).
          gh pr view --repo "$GH_REPO" "$PR_NUMBER" --json body -q '.body' > current_body.txt

          # Strip any previously injected jira block so we can re-emit a fresh
          # copy. Also strips the legacy coderabbit-trigger block from bodies
          # authored under the old manual-trigger flow; harmless on PRs that
          # never had one. The trim counter eats the trailing blank + "---"
          # separator that used to sit after the jira block.
          awk '
            BEGIN { skip = 0; trim = 0 }
            /<!-- jira-injected -->/ { skip = 1; next }
            /<!-- \/jira-injected -->/ { skip = 0; trim = 2; next }
            /<!-- coderabbit-trigger -->/ { skip = 1; next }
            /<!-- \/coderabbit-trigger -->/ { skip = 0; trim = 2; next }
            skip { next }
            trim > 0 {
              if (trim == 2 && $0 == "") { trim = 1; next }
              if (trim == 1 && $0 == "---") { trim = 0; next }
              trim = 0
            }
            { print }
          ' current_body.txt > original_body.txt

          # Drop leading and trailing blank lines so the strip + rebuild cycle
          # converges on a stable body. Without this, the blank after the
          # "---" separator would accumulate on every run and defeat the cmp
          # short-circuit below, causing endless edit loops.
          sed -i '/./,$!d' original_body.txt
          tac original_body.txt | sed '/./,$!d' | tac > original_body.trimmed
          mv original_body.trimmed original_body.txt

          # Assemble final body: [optional jira block] + [original content].
          {
            if [ "$HAVE_JIRA" = "1" ]; then
              echo "<!-- jira-injected -->"
              echo "### [$JIRA_KEY]($URL) — $SUMMARY"
              echo ""
              echo "**Type:** \`$ISSUE_TYPE\`  •  **Status:** \`$STATUS\`"
              echo ""
              echo "<details><summary>Jira ticket description</summary>"
              echo ""
              echo "$DESCRIPTION"
              echo ""
              echo "</details>"
              echo "<!-- /jira-injected -->"
              echo ""
              echo "---"
              echo ""
            fi
            cat original_body.txt
          } > final_body.txt

          # Short-circuit if the rebuilt body is byte-identical to what's on
          # the PR. Other bots (Atlassian Smart Links, CodeRabbit walkthroughs)
          # edit the body and fire their own `edited` events; without this
          # guard we'd re-edit on every bot touch and loop forever.
          if cmp -s current_body.txt final_body.txt; then
            echo "::notice::PR body already up to date; skipping edit."
            exit 0
          fi

          gh pr edit --repo "$GH_REPO" "$PR_NUMBER" --body-file final_body.txt
